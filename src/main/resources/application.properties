#Fri Sep 11 18:47:30 IST 2026
micronaut.application.name=api_v2
micronaut.router.static-resources.redoc.mapping=/redoc/**
micronaut.router.static-resources.redoc.paths=classpath\:META-INF/swagger/views/redoc
micronaut.router.static-resources.swagger.mapping=/swagger/**
micronaut.router.static-resources.swagger.paths=classpath\:META-INF/swagger
micronaut.server.port=8086
# CORS for all origins (Elysia's cors() default)
micronaut.server.cors.enabled=true
# Analysis worker pool (0 = number of CPUs); large stacks are needed by the tokenizer's URL/e-mail regexes
sentivox.analyzer.threads=0
sentivox.analyzer.thread-stack-size-mb=512
# Upstash Redis credentials come from the UPSTASH_REDIS_URL and UPSTASH_REDIS_TOKEN environment variables
# (bound to upstash.redis.url / upstash.redis.token); the app refuses to start without them.
